name: Build
on:
  push:
    branches:
      - 001-sonarqube-report-viewer
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run tests with coverage (Cobertura XML)
        working-directory: backend
        run: uv run pytest tests/ --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing --tb=short -q

      - name: Verify coverage report exists
        run: |
          test -f backend/coverage.xml
          echo "Found backend/coverage.xml"
          ls -lah backend/coverage.xml

      - name: Show Sonar config (debug)
        run: |
          echo "--- sonar-project.properties ---"
          sed -n '1,200p' sonar-project.properties

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
