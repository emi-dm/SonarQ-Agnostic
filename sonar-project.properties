sonar.projectKey=emi-dm_SonarQ-Agnostic
sonar.organization=phd-sdd

# Project scope
sonar.sources=backend/src,frontend
sonar.tests=backend/tests

# Python coverage (Cobertura XML generated by pytest-cov in CI)
sonar.python.coverage.reportPaths=backend/coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/.pytest_cache/**,**/.hypothesis/**,**/*.db,**/*.sqlite,**/specs/**


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=SonarQ-Agnostic
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8